[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "KDTree_Python"
version = "1.0.0"
description = "This project provides a lazily built KD_TREE operating on particles or triangle faces in three dimensional space."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ben Frauenknecht", email = "ben.Frauenknecht@tum.de" },
]
classifiers = [
    "License :: BSD",
]

# Optional: runtime dependency specification
# dependencies = [ "cryptography >=41.0" ]

[project.urls]
Homepage = "https://github.com/your/project"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# Read version from version.cmake
cmake.version = ">=3.15"
cmake.verbose = true
cmake.build-type = "Release"
wheel.packages = ["KDTree_Python"]

# CMake configuration
[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
KD_TREE_PARALLELIZATION = {env = "KD_TREE_PARALLELIZATION", default = "TBB"}
KD_TREE_LOGGING_LEVEL = {env = "KD_TREE_LOGGING_LEVEL", default = "INFO"}
BUILD_KD_TREE_DOCS = "OFF"
BUILD_KD_TREE_TESTS = "OFF"
BUILD_KD_TREE_LIBRARY = "ON"
BUILD_KD_TREE_EXECUTABLE = "OFF"
BUILD_KD_TREE_PYTHON_INTERFACE = "ON"
BUILD_SHARED_LIBS = {env = "BUILD_SHARED_LIBS", default = "OFF"}

# TODO review
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.15"