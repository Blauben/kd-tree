[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "scikdtree"
dynamic = ["version"]
description = "This project provides a lazily built KD_TREE operating on particles or triangle faces in three dimensional space."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ben Frauenknecht", email = "ben.Frauenknecht@tum.de" },
]
license = "BSD-3-Clause"

[project.urls]
Homepage = "https://github.com/Blauben/kd-tree"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Read version from version.cmake
cmake.version = ">=3.15"
cmake.verbose = true
cmake.args = ["--preset", "python-tbb"]
wheel.packages = ["scikdtree"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/KDTree/Info.h"
regex = 'KD_TREE_VERSION\s*=\s*"(?P<value>.*?)"\s*;'

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
repair-wheel-command = """
  DYLD_LIBRARY_PATH=$(find $(pwd)/build -name 'libtbb.12.dylib' | xargs file | grep -i {delocate_archs} | head -1 | cut -d: -f1 | xargs dirname) \
  delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
"""

[tool.cibuildwheel.linux]
repair-wheel-command = """
  LD_LIBRARY_PATH=$(find /project/build -name "libtbb.so.12" -exec dirname {} \\; | head -1):$LD_LIBRARY_PATH \
  auditwheel repair -w {dest_dir} {wheel}
"""

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test",
]