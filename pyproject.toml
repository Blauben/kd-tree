[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "scikdtree"
version = "1.0.0"
description = "This project provides a lazily built KD_TREE operating on particles or triangle faces in three dimensional space."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Ben Frauenknecht", email = "ben.Frauenknecht@tum.de" },
]
classifiers = [
    "License :: BSD",
]

[project.urls]
Homepage = "https://github.com/your/project"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# Read version from version.cmake
cmake.version = ">=3.15"
cmake.verbose = true
cmake.args = ["--preset", "python-tbb"]
wheel.packages = ["scikdtree"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "10.15"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test",
]