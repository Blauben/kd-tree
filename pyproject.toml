[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.4.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "scikdtree"
dynamic = ["version"]
description = "This project provides a lazily built KD_TREE operating on particles or triangle faces in three dimensional space."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib >= 3.9.0",
    "tqdm >= 4.0.0",
]
authors = [
    { name = "Ben Frauenknecht", email = "ben.Frauenknecht@tum.de" },
]
license = "BSD-3-Clause"
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 4 - Beta",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "numpy",
    "pytest >= 6.0",
]

[project.urls]
Homepage = "https://github.com/Blauben/kd-tree"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "0.4"

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

# Read package version from Git tags/metadata via setuptools_scm
cmake.version = ">=3.15"
cmake.verbose = true
cmake.args = ["--preset", "python-tbb"]
wheel.packages = ["scikdtree"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# Guarantees metadata generation even when tags are unavailable (e.g. exported source tree)
fallback_version = "0.0.0"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "test",
]