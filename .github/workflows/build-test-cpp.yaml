name: C/C++ build and test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:

jobs:
# Build the C++ library & test that it is working using GoogleTest
  build-and-test-cpp:
    name: C/C++ Library on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      # Caches the scaled benchmark meshes generated by cmake/scale_test_meshes.cmake via
      # script/scale_mesh.py, since scaling them (esp. the larger ones) is by far the slowest
      # part of configuring/building this preset and can push the job over its timeout.
      # Invalidated automatically whenever the source meshes, the scaling script, or the
      # face-amounts/mesh list (embedded in scale_test_meshes.cmake) change.
      - name: Cache scaled benchmark meshes
        id: scaled-mesh-cache
        uses: actions/cache@v4
        with:
          path: build/test-release/resources
          key: scaled-meshes-${{ matrix.os }}-${{ hashFiles('resources/**', 'script/scale_mesh.py', 'cmake/scale_test_meshes.cmake') }}
      # actions/cache preserves each file's mtime from when it was saved, which can be older than
      # the just-checked-out sources it depends on; without this, CMake's up-to-date check would
      # see "newer" sources and regenerate the meshes anyway, defeating the cache.
      - name: Mark cached scaled meshes as up to date
        if: steps.scaled-mesh-cache.outputs.cache-hit == 'true'
        shell: bash
        run: find build/test-release/resources -type f -exec touch {} +
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Installs the mesh-gen dependency group (script/scale_mesh.py's deps) declared in pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install --group mesh-gen
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
      - name: Install libomp (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install libomp
      - name: Build and test (Linux & macOS)
        run: cmake --workflow --preset build-and-test-release
