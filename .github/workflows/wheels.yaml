name: Build & Publish Python Package

on:
  pull_request:
  release:
    types: [created]
    # Only trigger for regular releases, not pre-releases
    # See https://docs.github.com/en/actions/reference/events-that-trigger-workflows#release
    # for more information on the release event
    prerelease: false
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # 1.a Build the wheels on a matrix of Windows, MacOS, and Linux platforms using cibuildwheel
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
          # Linux aarch64 — native ARM runner, no QEMU needed
          - os: ubuntu-24.04-arm
            arch: aarch64
          # macOS (arm64 runner, builds both arm64 and x86_64 via cross-compile)
          - os: macos-latest
            arch: universal
          # Windows x86_64
          - os: windows-latest
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (Linux x86_64)
        uses: pypa/cibuildwheel@v3.4.1
        env:
          MPLBACKEND: Agg # Use a backend that is able to run in headless environments (like GitHub Actions) to avoid build failures due to missing display
          CIBW_BEFORE_BUILD: |
            pipx install ninja cmake
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: 'pytest {project}'
          CIBW_TEST_REQUIRES: |
            numpy
            pytest>=6.0
          CIBW_TEST_SOURCES: |
            resources
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            TBB_LIB=$(find $(pwd) -type f -name "libtbb*.so*" | head -n 1)
            BUILD_PATH=$(dirname "$TBB_LIB")
            export LD_LIBRARY_PATH="$BUILD_PATH"
            echo "Running auditwheel repair for linux wheel with additional paths: $BUILD_PATH"
            auditwheel repair -w {dest_dir} {wheel}
        with:
          package-dir: .
          output-dir: dist
        if: matrix.os == 'ubuntu-latest'

      - name: Build wheels (Linux aarch64 — native ARM)
        uses: pypa/cibuildwheel@v3.4.1
        env:
          MPLBACKEND: Agg # Use a backend that is able to run in headless environments (like GitHub Actions) to avoid build failures due to missing display
          CIBW_BEFORE_BUILD: |
            pipx install ninja cmake
          CIBW_ARCHS_LINUX: aarch64
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_COMMAND: 'pytest {project}'
          CIBW_TEST_REQUIRES: |
            numpy
            pytest>=6.0
          CIBW_TEST_SOURCES: |
            resources
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            TBB_LIB=$(find $(pwd) -type f -name "libtbb*.so*" | head -n 1)
            BUILD_PATH=$(dirname "$TBB_LIB")
            export LD_LIBRARY_PATH="$BUILD_PATH"
            auditwheel repair -w {dest_dir} {wheel}
        with:
          package-dir: .
          output-dir: dist
        if: matrix.os == 'ubuntu-24.04-arm'
      ############################# MACOS WHEELS #############################
      # We use Apple Clang as it is the only compiler offering cross-compiling for x86_64
      # The macOS GitHub Runner is nowadays arm64 based
      - name: Build wheels (macOS)
        uses: pypa/cibuildwheel@v3.4.1
        env:
          MPLBACKEND: Agg # Use a backend that is able to run in headless environments (like GitHub Actions) to avoid build failures due to missing display
          CIBW_BEFORE_BUILD: |
            pipx install ninja cmake
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET="12"
            CC=clang
            CXX=clang++
            CXXFLAGS="-stdlib=libc++ -D_VSTD=std"
            LDFLAGS="-stdlib=libc++"
            CMAKE_ARGS="-DCMAKE_CXX_STANDARD=20 -DCMAKE_INSTALL_RPATH=@loader_path"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_TEST_COMMAND: 'pytest {project}'
          CIBW_TEST_REQUIRES: |
            numpy
            pytest>=6.0
          CIBW_TEST_SOURCES: |
            resources
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            WHEEL_ID=$(basename {wheel} | grep -oE 'cp[0-9]+(t?)-cp[0-9]+(t?)')
            TBB_LIB=$(find $(pwd)/build -type f -name "libtbb*.dylib" \
              | grep "$WHEEL_ID" \
              | grep "{delocate_archs}" \
              | head -n 1)
            BUILD_PATH=$(dirname "$TBB_LIB")
            export DYLD_LIBRARY_PATH="$BUILD_PATH:$DYLD_LIBRARY_PATH"
            echo "Running delocate repair for macOS wheel with additional paths: $BUILD_PATH"
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} {wheel}
        with:
          package-dir: .
          output-dir: dist
        if: matrix.os == 'macos-latest'
      ############################# WINDOWS WHEELS #############################
      # Set up the Visual Studio environment on Windows (required, so that CMake finds the compiler)
      # We use the Microsoft Visual Studio Compiler to compile the wheel
      # As of 09.09.2024, it is not yet possible to build free-threaded wheel on Windows
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
      - name: Enable long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f
        if: matrix.os == 'windows-latest'
      - name: Build wheels (Windows)
        uses: pypa/cibuildwheel@v3.4.1
        env:
          MPLBACKEND: Agg # Use a backend that is able to run in headless environments (like GitHub Actions) to avoid build failures due to missing display
          CIBW_BEFORE_BUILD: |
            pipx install ninja cmake
          CIBW_ARCHS_WINDOWS: "auto64"
          CIBW_TEST_COMMAND: 'pytest {project}'
          CIBW_TEST_REQUIRES: |
            numpy
            pytest>=6.0
          CIBW_TEST_SOURCES: |
            resources
        with:
          package-dir: .
          output-dir: dist
        if: matrix.os == 'windows-latest'
      - uses: actions/upload-artifact@v4
        with:
          path: dist/*.whl
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}  # Unique name per OS

  # 1.b Build the source distribution by simply running the build command
  make_sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          path: dist/*.tar.gz
          name: sdist

   # 2. Upload the wheels and the source distribution to testpypi
   #    using trusted publishing
  upload_testpypi:
    needs: [build_wheels, make_sdist]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/scikdtree
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release'  # Only upload to PyPI on actual releases, not on pushes or pull requests
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  # 3. Upload the wheels to the actually Python Package Index
  #    using trusted publishing
  upload_pypi:
    needs: [build_wheels, make_sdist, upload_testpypi]
    environment:
      name: pypi
      url: https://pypi.org/p/scikdtree
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release'  # Only upload to PyPI on actual releases, not on pushes or pull requests
    steps:
     - uses: actions/download-artifact@v6
       with:
         path: dist
         merge-multiple: true
     - uses: pypa/gh-action-pypi-publish@release/v1
