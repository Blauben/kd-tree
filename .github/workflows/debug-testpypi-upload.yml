name: debug-testpypi-upload.yml
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID to pull wheels from'
        required: true

jobs:
  upload_testpypi:
    environment:
      name: testpypi
      url: https://test.pypi.org/p/scikdtree
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          run-id: ${{ inputs.run_id }}
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true
